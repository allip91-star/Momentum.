<script>

function logAmount(id,amount){const h=db.habits.find(x=>x.id===id);if(!h||!Number.isFinite(amount)||amount<=0||amount>10000000)return;const current=total(h,parseISO(selected)),wasReached=goalReached(h,parseISO(selected));if(selected>localISO(now()))return;db.entries[h.id]??={};db.events??={};db.events[h.id]??={};db.logs??={};db.logs[h.id]??={};db.logs[h.id][selected]??=[];const priorEvents=dayEvents(h,selected);db.logs[h.id][selected].push(amount);db.entries[h.id][selected]=aggregation(h)==='latest'?amount:aggregation(h)==='max'?Math.max(dayCount(h,selected),amount):round3(dayCount(h,selected)+amount);db.events[h.id][selected]=priorEvents+1;save();render();const justAchieved=!wasReached&&goalReached(h,parseISO(selected));const st=justAchieved&&selected===localISO(now())?streakStats(h).current:0;
 showToast([3,7,14,30,50,100].includes(st)?`🔥 ${streakLabel(h,st)} streak!`:justAchieved?'Goal achieved! ✓':'Progress logged ✓')}
function changeTick(id,diff){const h=db.habits.find(x=>x.id===id);if(!h)return;const day=dayCount(h,selected),current=total(h,parseISO(selected));if(diff>0){if(goalReached(h,parseISO(selected))&&aggregation(h)==='sum'&&selected===localISO(now())){showToast('Goal already completed ✨');return}logAmount(id,step(h));return}if(day<=0){showToast('No progress to remove for this day');return}let logs=db.logs?.[h.id]?.[selected],amount=logs?.length?logs.pop():Math.min(day,step(h));const priorEvents=dayEvents(h,selected);const next=aggregation(h)==='sum'?round3(Math.max(0,day-amount)):logs&&logs.length?(aggregation(h)==='latest'?Number(logs.at(-1)):Math.max(...logs)):0;if(next>0)db.entries[h.id][selected]=next;else delete db.entries[h.id][selected];db.events??={};db.events[h.id]??={};db.events[h.id][selected]=Math.max(0,priorEvents-1);save();render();showToast('Last log undone')}

function shareBackup(){const json=JSON.stringify({...db,version:2,exportedAt:new Date().toISOString()},null,2);if(window.AndroidBridge&&typeof window.AndroidBridge.shareBackup==='function'){window.AndroidBridge.shareBackup(json);showToast('Choose where to save your backup');return}try{const blob=new Blob([json],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`momentum-backup-${localISO(now())}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);showToast('Backup created')}catch(e){openBackupText(json)}}
function openBackupText(json){modal={type:'backup'};dialogRoot.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modal-top"><span class="modal-title">Copy your backup</span><button class="close-btn" data-action="close">×</button></div><p class="subline">Copy this text into a safe place. You can paste it when restoring your data.</p><div class="field"><textarea id="backup-json" class="backup-area" readonly>${esc(json)}</textarea></div><button class="small-primary" data-action="copy-backup">Copy backup text</button></div></div>`}
function openImport(){modal={type:'import'};dialogRoot.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modal-top"><span class="modal-title">Restore a backup</span><button class="close-btn" data-action="close">×</button></div><p class="subline">Import a Momentum .json backup file, or paste a backup. Restoring replaces the habits and ticks currently on this device.</p><div class="field"><label for="restore-file">CHOOSE BACKUP FILE</label><input id="restore-file" type="file" accept=".json,application/json"></div><div class="field"><label for="restore-json">OR PASTE BACKUP JSON</label><textarea id="restore-json" rows="4" placeholder="Paste backup text here..."></textarea></div><div class="modal-bottom"><button class="btn-cancel" data-action="close">Cancel</button><button class="btn-save" data-action="restore">Restore</button></div></div></div>`}
function validBackup(obj){return !!obj&&Array.isArray(obj.habits)&&obj.entries&&typeof obj.entries==='object'&&obj.habits.every(h=>h&&typeof h.id==='string'&&typeof h.name==='string'&&['daily','weekly','monthly'].includes(h.frequency)&&Number.isFinite(Number(h.goal))&&Number(h.goal)>=0.001&&Number(h.goal)<=10000000)}
function restoreJson(text){try{const obj=JSON.parse(text);if(!validBackup(obj)){showToast('That file is not a valid Momentum backup');return}db={habits:obj.habits.map(h=>({...h,name:String(h.name).slice(0,65),aggregation:['sum','latest','max'].includes(h.aggregation)?h.aggregation:'sum',goalMode:h.goalMode==='atMost'?'atMost':'atLeast',category:['Fitness','Health','Learning','Personal','Other'].includes(h.category)?h.category:'Personal',scheduleMode:['any','weekdays','interval'].includes(h.scheduleMode)?h.scheduleMode:'any',weekdays:Array.isArray(h.weekdays)?h.weekdays.map(Number).filter(d=>d>=1&&d<=7):[1,2,3,4,5,6,7],intervalDays:Math.max(2,Math.min(365,Number(h.intervalDays)||2)),pauses:Array.isArray(h.pauses)?h.pauses.filter(p=>p&&/^\d{4}-\d{2}-\d{2}$/.test(p.start)).map(p=>({start:p.start,end:p.end||''})):[],emoji:emojiOptions.includes(h.emoji)?h.emoji:'✨',unit:String(h.unit||'times').slice(0,24),goal:Math.max(.001,Math.min(10000000,Number(h.goal))),kind:kind(h),step:Math.max(.001,Number(h.step)||1),color:validColor(h.color)?h.color:undefined,widgetVisible:h.widgetVisible!==false,hideWhenComplete:h.hideWhenComplete!==false,dueTime:validTime(h.dueTime)?h.dueTime:'',dueWeekday:Math.max(1,Math.min(7,Number(h.dueWeekday)||7)),dueMonthday:Math.max(0,Math.min(31,Number(h.dueMonthday)||0)),reminderEnabled:h.reminderEnabled===true&&validTime(h.reminderTime),reminderTime:validTime(h.reminderTime)?h.reminderTime:'',reminderMode:h.reminderMode==='once'?'once':'daily',reminderWeekday:Math.max(1,Math.min(7,Number(h.reminderWeekday)||1)),reminderMonthday:Math.max(0,Math.min(31,Number(h.reminderMonthday)||1)),created:h.created||localISO(now())})),settings:{weeklySummary:obj.settings?.weeklySummary===true},widgetOrder:Array.isArray(obj.widgetOrder)?obj.widgetOrder.filter(x=>typeof x==='string'):[],entries:obj.entries,events:obj.events||{},logs:obj.logs||{},created:obj.created||localISO(now())};save();closeModal();render();showToast('Your habits have been restored ✓')}catch(e){showToast('Could not read that backup file')}}
function handleAction(b,e){const a=b.dataset.action,id=b.dataset.id;
 switch(a){case 'new':openForm();break;case 'edit':openForm(id);break;case 'close':closeModal();break;
 case 'outside':if(e.target===b)closeModal();break;
 case 'plus':changeTick(id,1);break;case 'minus':changeTick(id,-1);break;case 'log':openLog(id);break;
 case 'prev-day':selected=localISO(addDays(parseISO(selected),-1));render();break;
 case 'next-day':if(selected<localISO(now()))selected=localISO(addDays(parseISO(selected),1));render();break;
 case 'go-today':selected=localISO(now());render();break;
 case 'go-history':tab='history';monthDate=startOfMonth(parseISO(selected));render();break;
 case 'go-selected-today':tab='today';render();break;
 case 'prev-month':monthDate=addMonths(monthDate,-1);render();break;
 case 'next-month':if(localISO(monthDate)<localISO(startOfMonth(now())))monthDate=addMonths(monthDate,1);render();break;
 case 'select-date':selected=b.dataset.date;render();break;
 case 'filter':manageFilter=b.dataset.filter;render();break;case 'category':categoryFilter=b.dataset.category;render();break;case 'progress-view':progressView=b.dataset.view;render();break;case 'pause':togglePause(id);break;
 case 'emoji':document.getElementById('habit-emoji').value=b.dataset.emoji;document.getElementById('selected-emoji').textContent=b.dataset.emoji;dialogRoot.querySelectorAll('.emoji-opt').forEach(x=>x.classList.toggle('on',x===b));b.closest('details')?.removeAttribute('open');break;
 case 'habit-color':document.getElementById('habit-color').value=b.dataset.color;document.getElementById('habit-color-picker').value=b.dataset.color;document.getElementById('selected-colour').style.background=b.dataset.color;dialogRoot.querySelectorAll('[data-action=habit-color]').forEach(x=>x.classList.toggle('chosen',x===b));break;
 case 'widget-settings':tab='widget';render();window.scrollTo({top:0,behavior:'instant'});break;
 case 'back-habits':tab='habits';render();break;
 case 'widget-up':widgetMove(id,-1);break;
 case 'widget-down':widgetMove(id,1);break;
 case 'global-color':{const picker=document.getElementById('global-color-input');if(picker)picker.value=b.dataset.color;document.querySelectorAll('[data-action=global-color]').forEach(x=>x.classList.toggle('chosen',x===b));break;}
 case 'apply-all-color':{const chosen=document.getElementById('global-color-input')?.value;if(!validColor(chosen)){showToast('Choose a valid colour');break}db.habits.forEach(h=>h.color=chosen);save();render();showToast('All habits now have the same colour');break;}
 case 'delete-ask':openDelete();break;
 case 'delete-confirm':db.habits=db.habits.filter(h=>h.id!==modal.id);delete db.entries[modal.id];db.widgetOrder=(db.widgetOrder||[]).filter(id=>id!==modal.id);save();closeModal();render();showToast('Habit deleted');break;
 case 'export':shareBackup();break;case 'import':openImport();break;
 case 'copy-backup':{let t=document.getElementById('backup-json');t?.select();if(navigator.clipboard?.writeText){navigator.clipboard.writeText(t.value).then(()=>showToast('Copied!')).catch(()=>showToast('Select the text to copy'))}else{document.execCommand('copy');showToast('Backup selected for copying')}break;}
 case 'restore':{const f=document.getElementById('restore-file')?.files?.[0];if(f){const reader=new FileReader();reader.onload=()=>restoreJson(reader.result);reader.onerror=()=>showToast('Could not open the file');reader.readAsText(f)}else{const pasted=document.getElementById('restore-json')?.value.trim();if(pasted)restoreJson(pasted);else showToast('Choose a file or paste a backup')}break;}
 }
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;if(tab==='history')monthDate=startOfMonth(parseISO(selected));render();window.scrollTo({top:0,behavior:'instant'});return}const button=e.target.closest('[data-action]');if(button)handleAction(button,e)});
document.addEventListener('change',e=>{const el=e.target;if(['habit-due-enabled','habit-reminder-enabled','habit-reminder-mode'].includes(el.id)){updateScheduleFields();return}if(el.id==='weekly-summary-enabled'){db.settings??={};db.settings.weeklySummary=el.checked;if(el.checked)window.AndroidBridge?.requestNotifications?.();save();render();return}if(el.id==='manage-frequency'){manageFilter=el.value;render();return}if(el.id==='manage-category'){categoryFilter=el.value;render();return}if(el.id==='habit-frequency'){updateScheduleFields();return}if(el.id==='habit-kind'||el.name==='aggregation'){updateTrackingFields();return}if(el.id==='habit-unit-choice'){updateUnitField();return}if(el.name==='scheduleMode'){updateScheduleMode();return}if(el.matches('[data-widget-visible]')){const h=db.habits.find(h=>h.id===el.dataset.widgetVisible);if(h){h.widgetVisible=el.checked;save();render();}}});
document.addEventListener('input',e=>{if(e.target.id==='habit-color-picker'){const hidden=document.getElementById('habit-color');if(hidden)hidden.value=e.target.value;const dot=document.getElementById('selected-colour');if(dot)dot.style.background=e.target.value;dialogRoot.querySelectorAll('[data-action=habit-color]').forEach(b=>b.classList.toggle('chosen',b.dataset.color.toLowerCase()===e.target.value.toLowerCase()));}});
// Pointer drag supports phones as well as desktop. Arrow controls remain available for accessibility.
let widgetDrag=null;
document.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-drag-id]');if(!handle)return;const row=handle.closest('[data-widget-row]');if(!row)return;widgetDrag={pointerId:e.pointerId,row,handle,startY:e.clientY,moved:false};handle.setPointerCapture?.(e.pointerId);row.classList.add('widget-dragging');});
document.addEventListener('pointermove',e=>{if(!widgetDrag||e.pointerId!==widgetDrag.pointerId)return;const {row}=widgetDrag;if(Math.abs(e.clientY-widgetDrag.startY)>5)widgetDrag.moved=true;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-widget-row]');if(!target||target===row)return;const list=document.getElementById('widget-sort-list');if(!list||!list.contains(target))return;const rect=target.getBoundingClientRect();list.insertBefore(row,e.clientY<rect.top+rect.height/2?target:target.nextSibling);});
function endWidgetDrag(e){if(!widgetDrag||e.pointerId!==widgetDrag.pointerId)return;const drag=widgetDrag;widgetDrag=null;drag.row.classList.remove('widget-dragging');const rows=[...document.querySelectorAll('[data-widget-row]')];if(rows.length){const ids=rows.map(r=>r.dataset.widgetRow);if(ids.some((id,i)=>orderedWidgetHabits()[i]?.id!==id)){db.widgetOrder=ids;save();render();showToast('Widget order saved');}}}
document.addEventListener('pointerup',endWidgetDrag);document.addEventListener('pointercancel',endWidgetDrag);
document.addEventListener('submit',e=>{if(e.target.id==='log-form'){e.preventDefault();const id=modal?.id,amount=Number(new FormData(e.target).get('amount'));if(!Number.isFinite(amount)||amount<=0||amount>10000000){showToast('Enter a positive amount');return}closeModal();logAmount(id,amount);return}if(e.target.id!=='habit-form')return;e.preventDefault();const fd=new FormData(e.target),name=String(fd.get('name')||'').trim().slice(0,65),freq=String(fd.get('frequency')),emoji=String(fd.get('emoji')),goal=Number(fd.get('goal')),unitChoice=String(fd.get('unitChoice')||'times'),unit=(unitChoice==='__custom__'?String(fd.get('customUnit')||'').trim():unitChoice).slice(0,24),hKind=String(fd.get('kind'))==='amount'?'amount':'count',quickAdd=hKind==='count'?1:Number(fd.get('step')||1),color=String(fd.get('color')||''),widgetVisible=fd.has('widgetVisible'),hideWhenComplete=fd.has('hideWhenComplete'),dueTime=fd.has('dueEnabled')?String(fd.get('dueTime')||''):'',dueWeekday=Number(fd.get('dueWeekday')||7),dueMonthday=Number(fd.get('dueMonthday')||0),reminderEnabled=fd.has('reminderEnabled'),reminderTime=reminderEnabled?String(fd.get('reminderTime')||''):'',reminderMode=String(fd.get('reminderMode')||'daily')==='once'?'once':'daily',reminderWeekday=Number(fd.get('reminderWeekday')||1),reminderMonthday=Number(fd.get('reminderMonthday')||1),category=String(fd.get('category')||'Personal'),scheduleMode=String(fd.get('scheduleMode')||'any'),weekdays=fd.getAll('weekdays').map(Number),intervalDays=Number(fd.get('intervalDays')||2),aggregationValue=hKind==='count'?'sum':String(fd.get('aggregation')||'sum'),goalModeValue=hKind==='count'?'atLeast':String(fd.get('goalMode')||'atLeast');if(reminderEnabled)window.AndroidBridge?.requestNotifications?.();if(scheduleMode==='weekdays'&&!weekdays.length){showToast('Choose at least one day');return}if(scheduleMode==='interval'&&(!Number.isInteger(intervalDays)||intervalDays<2||intervalDays>365)){showToast('Choose a valid interval');return}if(!name){s let lastCalendarDay=localISO(now());setInterval(()=>{const newDay=localISO(now());if(newDay!==lastCalendarDay){if(selected===lastCalendarDay)selected=newDay;lastCalendarDay=newDay;render()}if(window.AndroidBridge)syncFromNative()},60000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});

render();
